
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Açaí de Pijama</title>

<style>
:root {
    --azul: #B9E3F8;
    --azul-claro: #EAF7FF;
    --azul-botao: #55B5E8;
    --azul-escuro: #24558A;
    --amarelo: #FFF0A8;
    --branco: #FFFFFF;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, sans-serif;
    color: var(--azul-escuro);
    background: var(--azul-claro);
}

header, main, footer {
    width: 100%;
    max-width: 560px;
    margin: 0 auto 14px;
}

header {
    padding: 20px 12px;
    text-align: center;
    background: var(--azul);
    border-radius: 16px;
}

header h1 { margin: 0 0 8px; font-size: 28px; }
header p { margin: 0; }

main {
    padding: 18px;
    background: var(--branco);
    border: 2px solid var(--amarelo);
    border-radius: 16px;
}

h2 {
    margin: 22px 0 12px;
    font-size: 18px;
}

.opcao {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 82px 20px;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    padding: 12px 8px;
    background: var(--azul-claro);
    border: 1px solid var(--azul);
    border-radius: 10px;
    cursor: pointer;
}

.preco {
    text-align: right;
    white-space: nowrap;
    font-size: 13px;
    font-weight: bold;
}

.opcao input[type="checkbox"],
.opcao input[type="radio"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--azul-botao);
    justify-self: end;
}

.campo {
    display: block;
    margin: 12px 0;
    font-weight: bold;
}

.campo input {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 6px;
    padding: 10px;
    border: 1px solid #9BBBD0;
    border-radius: 8px;
    background: white;
    color: var(--azul-escuro);
    font: inherit;
}

.dica {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    font-weight: normal;
}

#alerta {
    display: none;
    margin: 12px 0;
    padding: 12px;
    border-radius: 8px;
    background: var(--amarelo);
    line-height: 1.4;
}

.total {
    margin-top: 22px;
    padding: 18px 12px;
    background: var(--amarelo);
    border-radius: 12px;
}

.total h2 {
    margin: 0 0 12px;
    text-align: center;
}

.linha-total {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 10px 0;
}

.linha-total strong { white-space: nowrap; }

.valor-final {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #D9C65E;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

button {
    width: 100%;
    min-height: 46px;
    margin-top: 16px;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--azul-botao);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: var(--azul-escuro); }

#resultado {
    display: none;
    margin-top: 16px;
    padding: 14px;
    background: var(--azul-claro);
    border: 1px solid var(--azul);
    border-radius: 10px;
    white-space: pre-line;
    overflow-wrap: anywhere;
    line-height: 1.6;
}

footer {
    padding: 8px;
    text-align: center;
}

@media (max-width: 360px) {
    main { padding: 12px; }

    .opcao {
        grid-template-columns: minmax(0, 1fr) 76px 18px;
        gap: 5px;
        padding: 10px 6px;
        font-size: 13px;
    }

    .preco { font-size: 12px; }
}
</style>
</head>

<body>

<header>
    <h1>🍌 Açaí de Pijama 💙</h1>
    <p>Monte seu açaí do jeitinho que você gosta!</p>
</header>

<main>
<form id="pedidoForm">

    <h2>💛 1. Escolha o tamanho</h2>

    <label class="opcao">
        <span>Pequeno (300 ml)</span>
        <span class="preco">R$ 12,00</span>
        <input type="radio" name="tamanho" value="12" checked>
    </label>

    <label class="opcao">
        <span>Médio (500 ml)</span>
        <span class="preco">R$ 16,00</span>
        <input type="radio" name="tamanho" value="16">
    </label>

    <label class="opcao">
        <span>Grande (700 ml)</span>
        <span class="preco">R$ 20,00</span>
        <input type="radio" name="tamanho" value="20">
    </label>

    <h2>💙 2. Escolha os adicionais</h2>
    <div id="alerta" role="alert"></div>

    <label class="opcao">
        <span>Leite em pó</span>
        <span class="preco">R$ 2,00</span>
        <input type="checkbox" value="2" data-nome="Leite em pó">
    </label>

    <label class="opcao">
        <span>Banana</span>
        <span class="preco">R$ 2,00</span>
        <input type="checkbox" value="2" data-nome="Banana">
    </label>

    <label class="opcao">
        <span>Granola</span>
        <span class="preco">R$ 2,50</span>
        <input type="checkbox" value="2.5" data-nome="Granola">
    </label>

    <label class="opcao">
        <span>Leite condensado</span>
        <span class="preco">R$ 2,50</span>
        <input type="checkbox" value="2.5" data-nome="Leite condensado">
    </label>

    <label class="opcao">
        <span>Morango</span>
        <span class="preco">R$ 3,00</span>
        <input type="checkbox" value="3" data-nome="Morango">
    </label>

    <label class="opcao">
        <span>Paçoca</span>
        <span class="preco">R$ 2,00</span>
        <input type="checkbox" value="2" data-nome="Paçoca">
    </label>

    <h2>📍 3. Dados para entrega</h2>

    <label class="campo" for="nome">
        Nome completo *
        <input type="text" id="nome" name="nome"
               placeholder="Digite seu nome"
               autocomplete="name" maxlength="100" required>
    </label>

    <label class="campo" for="telefone">
        Telefone com DDD *
        <input type="tel" id="telefone" name="telefone"
               placeholder="(41) 99999-9999"
               autocomplete="tel" inputmode="numeric"
               maxlength="15" required>
        <span class="dica">A máscara será preenchida automaticamente.</span>
    </label>

    <label class="campo" for="bairro">
        Bairro *
        <input type="text" id="bairro" name="bairro"
               list="listaBairros"
               placeholder="Digite a primeira letra do bairro"
               autocomplete="address-level3"
               maxlength="100" required>
        <datalist id="listaBairros">
            <option value="Águas Claras">
            <option value="Bateias">
            <option value="Boa Vista">
            <option value="Bom Jesus">
            <option value="Botiatuva">
            <option value="Cambuí">
            <option value="Campina">
            <option value="Campo do Meio">
            <option value="Centro">
            <option value="Cercadinho">
            <option value="Cerne">
            <option value="Cristo Rei">
            <option value="Dom Rodrigo">
            <option value="Ferraria">
            <option value="Itaqui">
            <option value="Itaboa">
            <option value="Jardim Alvorada">
            <option value="Jardim Bela Vista">
            <option value="Jardim Busmayer">
            <option value="Jardim Carmela">
            <option value="Jardim Céu Azul">
            <option value="Jardim das Acácias">
            <option value="Jardim das Américas">
            <option value="Jardim das Palmeiras">
            <option value="Jardim Emília">
            <option value="Jardim Esmeralda">
            <option value="Jardim Florestal">
            <option value="Jardim Guarany">
            <option value="Jardim Iruama">
            <option value="Jardim Itália">
            <option value="Jardim Lise">
            <option value="Jardim Nossa Senhora do Perpétuo Socorro">
            <option value="Jardim Rivabem">
            <option value="Jardim Rondinha">
            <option value="Jardim Santa Luzia">
            <option value="Jardim São Vicente">
            <option value="Jardim Tropical">
            <option value="João Cosmo">
            <option value="Lagoa">
            <option value="Lavra">
            <option value="Ouro Verde">
            <option value="Passauna">
            <option value="Passo Fundo">
            <option value="Rondinha">
            <option value="Santa Cruz">
            <option value="São Marcos">
            <option value="São Pedro">
            <option value="Timbotuva">
            <option value="Três Córregos">
            <option value="Vila Bancária">
            <option value="Vila Gilcy">
            <option value="Vila Nova">
            <option value="Vila Otto">
            <option value="Vila Rivabem">
            <option value="Vila Santa Terezinha">
            <option value="Vila São Luiz">
            <option value="Vista Alegre">
        </datalist>
        <span class="dica">Digite e selecione uma das sugestões.</span>
    </label>

    <label class="campo" for="numeroCasa">
        Número da casa *
        <input type="text" id="numeroCasa" name="numeroCasa"
               placeholder="Ex.: 123 ou S/N"
               autocomplete="address-line2"
               maxlength="15" required>
    </label>

    <section class="total">
        <h2>💛 Resumo do pedido</h2>

        <div class="linha-total">
            <span>Valor do açaí:</span>
            <strong id="subtotal">R$ 12,00</strong>
        </div>

        <div class="linha-total">
            <span>Taxa de entrega:</span>
            <strong id="taxa">R$ 10,00</strong>
        </div>

        <div class="valor-final" id="valorTotal">R$ 22,00</div>
    </section>

    <button type="submit">Confirmar pedido 🍇</button>
    <div id="resultado" role="status" aria-live="polite"></div>

</form>
</main>

<footer>
    <p>🍌 Açaí + Bananas = Felicidade! 💛</p>
</footer>

<script>
const formulario = document.getElementById("pedidoForm");
const tamanhos = document.querySelectorAll('input[name="tamanho"]');
const adicionais = document.querySelectorAll('input[type="checkbox"]');
const telefone = document.getElementById("telefone");
const bairroInput = document.getElementById("bairro");
const alerta = document.getElementById("alerta");
const resultado = document.getElementById("resultado");
const subtotalEl = document.getElementById("subtotal");
const taxaEl = document.getElementById("taxa");
const totalEl = document.getElementById("valorTotal");

function dinheiro(valor) {
    return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });
}

/* Máscara automática para telefone com DDD */
telefone.addEventListener("input", function() {
    const numeros = telefone.value.replace(/\D/g, "").slice(0, 11);

    if (numeros.length === 0) {
        telefone.value = "";
    } else if (numeros.length <= 2) {
        telefone.value = "(" + numeros;
    } else if (numeros.length <= 6) {
        telefone.value = "(" + numeros.slice(0, 2) + ") " +
            numeros.slice(2);
    } else if (numeros.length <= 10) {
        telefone.value = "(" + numeros.slice(0, 2) + ") " +
            numeros.slice(2, 6) + "-" + numeros.slice(6);
    } else {
        telefone.value = "(" + numeros.slice(0, 2) + ") " +
            numeros.slice(2, 7) + "-" + numeros.slice(7);
    }

    telefone.setCustomValidity("");
    resultado.style.display = "none";
});

function obterLimite() {
    const tamanho = document.querySelector(
        'input[name="tamanho"]:checked'
    ).value;

    if (tamanho === "12") return 2;
    if (tamanho === "16") return 4;
    return Infinity;
}

function contarAdicionais() {
    return [...adicionais].filter(item => item.checked).length;
}

function calcularSubtotal() {
    let subtotal = Number(
        document.querySelector('input[name="tamanho"]:checked').value
    );

    adicionais.forEach(item => {
        if (item.checked) subtotal += Number(item.value);
    });

    return subtotal;
}

function calcularTaxa() {
    return bairroInput.value.trim().toLocaleLowerCase("pt-BR") === "centro"
        ? 5
        : 10;
}

function atualizarTotal() {
    const subtotal = calcularSubtotal();
    const taxa = calcularTaxa();

    subtotalEl.textContent = dinheiro(subtotal);
    taxaEl.textContent = dinheiro(taxa);
    totalEl.textContent = dinheiro(subtotal + taxa);
}

function mostrarAlerta(mensagem) {
    alerta.textContent = mensagem;
    alerta.style.display = "block";
}

function esconderAlerta() {
    alerta.textContent = "";
    alerta.style.display = "none";
}

adicionais.forEach(item => {
    item.addEventListener("change", function() {
        if (contarAdicionais() > obterLimite()) {
            item.checked = false;
            mostrarAlerta(
                "Este copo permite no máximo " + obterLimite() +
                " adicionais. A seleção excedente foi bloqueada."
            );
        } else {
            esconderAlerta();
        }

        resultado.style.display = "none";
        atualizarTotal();
    });
});

tamanhos.forEach(item => {
    item.addEventListener("change", function() {
        let quantidade = 0;
        let removidos = 0;

        adicionais.forEach(adicional => {
            if (adicional.checked) {
                quantidade++;

                if (quantidade > obterLimite()) {
                    adicional.checked = false;
                    removidos++;
                }
            }
        });

        if (removidos > 0) {
            mostrarAlerta(
                "O limite deste copo é " + obterLimite() +
                " adicionais. Os excedentes foram removidos."
            );
        } else {
            esconderAlerta();
        }

        resultado.style.display = "none";
        atualizarTotal();
    });
});

bairroInput.addEventListener("input", function() {
    resultado.style.display = "none";
    atualizarTotal();
});

formulario.addEventListener("submit", function(event) {
    event.preventDefault();
    esconderAlerta();

    const digitosTelefone = telefone.value.replace(/\D/g, "");

    if (digitosTelefone.length !== 10 && digitosTelefone.length !== 11) {
        telefone.setCustomValidity(
            "Digite um telefone com DDD e 10 ou 11 dígitos."
        );
        formulario.reportValidity();
        return;
    }

    telefone.setCustomValidity("");

    if (!formulario.checkValidity()) {
        formulario.reportValidity();
        return;
    }

    const listaBairros = document.getElementById("listaBairros");
    const bairro = bairroInput.value.trim();

    const bairroExiste = [...listaBairros.options].some(opcao =>
        opcao.value.toLocaleLowerCase("pt-BR") ===
        bairro.toLocaleLowerCase("pt-BR")
    );

    if (!bairroExiste) {
        mostrarAlerta("Selecione um bairro cadastrado nas sugestões.");
        bairroInput.focus();
        return;
    }

    if (contarAdicionais() > obterLimite()) {
        mostrarAlerta("A quantidade de adicionais excede o limite.");
        return;
    }

    const nome = document.getElementById("nome").value.trim();
    const numeroCasa = document.getElementById("numeroCasa").value.trim();
    const tamanho = document.querySelector(
        'input[name="tamanho"]:checked'
    );

    const nomesTamanhos = {
        "12": "Pequeno (300 ml)",
        "16": "Médio (500 ml)",
        "20": "Grande (700 ml)"
    };

    const escolhidos = [...adicionais]
        .filter(item => item.checked)
        .map(item => item.dataset.nome);

    const subtotal = calcularSubtotal();
    const taxa = calcularTaxa();
    const total = subtotal + taxa;

    resultado.textContent =
        "Pedido confirmado na tela! 💛\n\n" +
        "Cliente: " + nome + "\n" +
        "Telefone: " + telefone.value + "\n" +
        "Bairro: " + bairro + "\n" +
        "Número da casa: " + numeroCasa + "\n" +
        "Tamanho: " + nomesTamanhos[tamanho.value] + "\n" +
        "Adicionais: " +
        (escolhidos.length ? escolhidos.join(", ") : "Nenhum") +
        "\nValor do açaí: " + dinheiro(subtotal) +
        "\nTaxa de entrega: " + dinheiro(taxa) +
        "\nTOTAL: " + dinheiro(total) +
        "\n\nObrigado por escolher o Açaí de Pijama!";

    resultado.style.display = "block";
    atualizarTotal();
});

atualizarTotal();
</script>

</body>
</html>
